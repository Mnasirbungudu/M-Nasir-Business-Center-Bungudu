<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Deal With Us - M. Nasir Business Accessories Centre</title>

<style>

body{
font-family:Arial;
background:#eaf6ff;
margin:0;
}

header{
background:#0066cc;
color:white;
text-align:center;
padding:20px;
}

.container{
width:90%;
max-width:500px;
margin:30px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:15px;
background:#0066cc;
color:white;
border:none;
font-size:18px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#004999;
}

</style>

</head>

<body>

<header>

<h1>Deal With Us</h1>

<p>Create your customer account</p>

</header>

<div class="container">

<form>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="text" placeholder="Home Address" required>

<input type="email" placeholder="Email (Optional)">

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button>Create Account</button>

</form>

</div>

</body>

</html>
